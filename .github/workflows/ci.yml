name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Typecheck backend
        run: npx tsc -p tsconfig.json --noEmit

      - name: Typecheck UI
        run: cd apps/desktop && npx tsc --noEmit

      - name: Build UI
        run: cd apps/desktop && npx vite build

      - name: Fast test suite (no browser)
        run: npx vitest run

      - name: Smoke test
        run: npm run smoke

  build:
    runs-on: windows-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build NSIS installer
        run: npm run app:build
        env:
          # Skip sidecar bundling in CI (needs local whisper + signing key)
          AI_REPEAT_SKIP_SIDECAR: "1"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-repeat-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
